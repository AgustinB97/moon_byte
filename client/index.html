<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#083425" />
    <title>MoonByte — PCs Armadas & Hardware</title>
    <meta name="description" content="Tu tienda de PCs armadas, componentes y hardware gaming. Las mejores builds, los mejores precios." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo+Black&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply theme before React mounts (prevents FOIT + makes E2E tests reliable)
      try {
        var stored = JSON.parse(localStorage.getItem('mb-theme') || '{}');
        if (stored.state && stored.state.theme === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
